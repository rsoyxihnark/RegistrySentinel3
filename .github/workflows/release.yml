name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      release: ${{ steps.gate.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check version, subject and changelog
        id: gate
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          SOURCE = Path("registry_sentinel.py")
          CHANGELOG = Path("CHANGELOG.md")

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          def git(*args):
              done = subprocess.run(("git",) + args, capture_output=True, text=True)
              if done.returncode != 0:
                  fail(f"git {' '.join(args)} failed: {done.stderr.strip()}")
              return done.stdout

          def read(path):
              if not path.is_file():
                  fail(f"{path} is missing")
              return path.read_bytes().decode("utf-8").replace("\r\n", "\n").replace("\r", "\n")

          def emit(key, value):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write(f"{key}={value}\n")

          found = re.search(r'^APP_VERSION\s*=\s*"([^"]+)"\s*$', read(SOURCE), re.M)
          if found is None:
              fail("APP_VERSION could not be read from registry_sentinel.py")
          version = found.group(1).strip()

          subject = git("log", "-1", "--pretty=%s").strip()
          body = git("log", "-1", "--pretty=%b")

          shape = re.match(r"^\[([^\]]+)\]\s*(\S.*)$", subject)
          if shape is None:
              fail(
                  f"Commit subject must start with [{version}] or [no release] "
                  f"and then say what changed, got: {subject}"
              )
          label = shape.group(1).strip()
          releasing = label != "no release"
          if releasing and label != version:
              fail(
                  f"Commit subject ships [{label}] but registry_sentinel.py carries {version}"
              )

          parents = git("rev-list", "--parents", "-n", "1", "HEAD").split()
          if len(parents) > 1:
              listing = git("diff", "--name-only", parents[1], "HEAD")
          else:
              listing = git("show", "--pretty=format:", "--name-only", "HEAD")
          changed = [line.strip() for line in listing.splitlines() if line.strip()]
          touched_changelog = "CHANGELOG.md" in changed

          if releasing and not touched_changelog:
              fail("This commit changes what a user gets but leaves CHANGELOG.md untouched")

          changelog = read(CHANGELOG)
          headings = [line.strip() for line in re.findall(r"^##\s+(.+?)\s*$", changelog, re.M)]

          def entries_under(heading):
              block = re.search(
                  r"^##\s+" + re.escape(heading) + r"\s*$\n(.*?)(?=^##\s|\Z)",
                  changelog,
                  re.M | re.S,
              )
              if block is None:
                  return []
              return [
                  line.strip()
                  for line in block.group(1).splitlines()
                  if line.strip().startswith("- ")
              ]

          if releasing:
              if not headings or headings[0] != version:
                  fail(f"CHANGELOG.md must open with a section headed {version}")
              if any(heading.lower() == "unreleased" for heading in headings):
                  fail("A version commit must leave no Unreleased heading behind it")
              if git("tag", "--list", f"v{version}").strip():
                  fail(f"Version {version} has already been released")
              if git("ls-remote", "--tags", "origin", f"refs/tags/v{version}").strip():
                  fail(f"Version {version} has already been released")

              recorded = entries_under(version)
              if not recorded:
                  fail(f"The {version} section of CHANGELOG.md records no entries")
              published = [
                  line.strip() for line in body.splitlines() if line.strip().startswith("- ")
              ]
              if recorded != published:
                  fail(
                      "The CHANGELOG.md entries for "
                      f"{version} and the commit body bullet points must match word for word"
                  )
              print(f"Publishing {version} with {len(recorded)} entries")
          else:
              if touched_changelog and (not headings or headings[0].lower() != "unreleased"):
                  fail("A [no release] commit records its entries under an Unreleased heading")
              print("Building only, this commit ships nothing to users")

          emit("version", version)
          emit("release", "true" if releasing else "false")
          PY

  build:
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build Registry Sentinel
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name RegistrySentinel registry_sentinel.py

      - name: Check the build produced an executable
        shell: bash
        run: test -s dist/RegistrySentinel.exe

      - uses: actions/upload-artifact@v7
        with:
          name: RegistrySentinel
          path: dist/RegistrySentinel.exe
          if-no-files-found: error

      - name: Take the release notes from the commit body
        if: needs.gate.outputs.release == 'true'
        shell: bash
        run: git log -1 --pretty=%b > release-notes.md

      - name: Publish the release
        if: needs.gate.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.gate.outputs.version }}
          name: ${{ needs.gate.outputs.version }}
          body_path: release-notes.md
          files: dist/RegistrySentinel.exe
          fail_on_unmatched_files: true
          make_latest: 'true'
