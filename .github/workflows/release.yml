name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      release: ${{ steps.gate.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check version, subject and changelog
        id: gate
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          SOURCE = Path("registry_sentinel.py")
          CHANGELOG = Path("CHANGELOG.md")

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          def git(*args):
              done = subprocess.run(("git",) + args, capture_output=True, text=True)
              if done.returncode != 0:
                  fail(f"git {' '.join(args)} failed: {done.stderr.strip()}")
              return done.stdout

          def read(path):
              if not path.is_file():
                  fail(f"{path} is missing")
              return path.read_bytes().decode("utf-8").replace("\r\n", "\n").replace("\r", "\n")

          def emit(key, value):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write(f"{key}={value}\n")

          found = re.search(r'^APP_VERSION\s*=\s*"([^"]+)"\s*$', read(SOURCE), re.M)
          if found is None:
              fail("APP_VERSION could not be read from registry_sentinel.py")
          version = found.group(1).strip()

          subject = git("log", "-1", "--pretty=%s").strip()
          body = git("log", "-1", "--pretty=%b")

          shape = re.match(r"^\[([^\]]+)\]\s*(\S.*)$", subject)
          if shape is None:
              fail(
                  f"Commit subject must start with [{version}] or [no release] "
                  f"and then say what changed, got: {subject}"
              )
          label = shape.group(1).strip()
          releasing = label != "no release"
          if releasing and label != version:
              fail(
                  f"Commit subject ships [{label}] but registry_sentinel.py carries {version}"
              )

          parents = git("rev-list", "--parents", "-n", "1", "HEAD").split()
          if len(parents) > 1:
              listing = git("diff", "--name-only", parents[1], "HEAD")
          else:
              listing = git("show", "--pretty=format:", "--name-only", "HEAD")
          changed = [line.strip() for line in listing.splitlines() if line.strip()]
          touched_changelog = "CHANGELOG.md" in changed

          if releasing and not touched_changelog:
              fail("This commit changes what a user gets but leaves CHANGELOG.md untouched")

          changelog = read(CHANGELOG)
          headings = [line.strip() for line in re.findall(r"^##\s+(.+?)\s*$", changelog, re.M)]

          def entries_under(heading, text=None):
              block = re.search(
                  r"^##\s+" + re.escape(heading) + r"\s*$\n(.*?)(?=^##\s|\Z)",
                  changelog if text is None else text,
                  re.M | re.S,
              )
              if block is None:
                  return []
              return [
                  line.strip()
                  for line in block.group(1).splitlines()
                  if line.strip().startswith("- ")
              ]

          if releasing:
              if not headings or headings[0] != version:
                  fail(f"CHANGELOG.md must open with a section headed {version}")
              if any(heading.lower() == "unreleased" for heading in headings):
                  fail("A version commit must leave no Unreleased heading behind it")
              if git("tag", "--list", f"v{version}").strip():
                  fail(f"Version {version} has already been released")
              if git("ls-remote", "--tags", "origin", f"refs/tags/v{version}").strip():
                  fail(f"Version {version} has already been released")

              recorded = entries_under(version)
              if not recorded:
                  fail(f"The {version} section of CHANGELOG.md records no entries")
              published = [
                  line.strip() for line in body.splitlines() if line.strip().startswith("- ")
              ]
              if recorded != published:
                  fail(
                      "The CHANGELOG.md entries for "
                      f"{version} and the commit body bullet points must match word for word"
                  )
              print(f"Publishing {version} with {len(recorded)} entries")
          reworded = []
          if not releasing:
              if touched_changelog and (not headings or headings[0].lower() != "unreleased"):
                  earlier = git("show", f"{parents[1]}:CHANGELOG.md") if len(parents) > 1 else ""
                  earlier = earlier.replace("\r\n", "\n").replace("\r", "\n")
                  earlier_headings = [
                      line.strip() for line in re.findall(r"^##\s+(.+?)\s*$", earlier, re.M)
                  ]
                  if headings != earlier_headings or any(
                      len(entries_under(heading)) != len(entries_under(heading, earlier))
                      for heading in headings
                  ):
                      fail(
                          "A [no release] commit records new entries under an Unreleased heading "
                          "and may only reword the entries of versions already released"
                      )
                  reworded = [
                      heading
                      for heading in headings
                      if entries_under(heading) != entries_under(heading, earlier)
                  ]
                  for heading in reworded:
                      Path(f"notes-{heading}.md").write_text(
                          "\n".join(entries_under(heading)) + "\n", encoding="utf-8"
                      )
                      print(f"The published notes of {heading} will be reworded to match")
              print("Building only, this commit ships nothing to users")

          emit("version", version)
          emit("release", "true" if releasing else "false")
          emit("reworded", " ".join(reworded))
          PY

      - name: Bring reworded release notes in line with the changelog
        if: steps.gate.outputs.reworded != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REWORDED: ${{ steps.gate.outputs.reworded }}
        run: |
          for version in $REWORDED; do
            gh release edit "v$version" --repo "$GITHUB_REPOSITORY" --notes-file "notes-$version.md"
          done

  build:
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Write the version resource
        shell: python
        env:
          APP_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          import os
          from pathlib import Path

          version = os.environ["APP_VERSION"]
          quad = tuple(([int(part) for part in version.split(".")] + [0, 0, 0, 0])[:4])

          Path("version_info.txt").write_text(f"""VSVersionInfo(
            ffi=FixedFileInfo(
              filevers={quad},
              prodvers={quad},
              mask=0x3f,
              flags=0x0,
              OS=0x40004,
              fileType=0x1,
              subtype=0x0,
              date=(0, 0)
            ),
            kids=[
              StringFileInfo([
                StringTable('040904B0', [
                  StringStruct('CompanyName', 'ClementineDev'),
                  StringStruct('FileDescription', 'Registry Sentinel'),
                  StringStruct('FileVersion', '{version}'),
                  StringStruct('InternalName', 'RegistrySentinel'),
                  StringStruct('OriginalFilename', 'RegistrySentinel.exe'),
                  StringStruct('ProductName', 'Registry Sentinel'),
                  StringStruct('ProductVersion', '{version}')])
              ]),
              VarFileInfo([VarStruct('Translation', [1033, 1200])])
            ]
          )
          """, encoding="utf-8")

      - name: Draw the program icon
        shell: python
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          import struct
          import sys
          from pathlib import Path

          from PyQt6.QtCore import QBuffer, QIODevice
          from PyQt6.QtGui import QGuiApplication

          sys.path.insert(0, str(Path.cwd()))
          import registry_sentinel

          app = QGuiApplication(sys.argv)
          images = []
          for size in registry_sentinel.WINDOW_ICON_SIZES:
              buffer = QBuffer()
              buffer.open(QIODevice.OpenModeFlag.WriteOnly)
              if not registry_sentinel._shield_pixmap(size).save(buffer, "PNG"):
                  sys.exit(f"Could not draw the {size} px icon")
              images.append((size, bytes(buffer.data())))
          offset = 6 + 16 * len(images)
          directory = struct.pack("<HHH", 0, 1, len(images))
          blobs = b""
          for size, blob in images:
              directory += struct.pack(
                  "<BBBBHHII", size % 256, size % 256, 0, 0, 1, 32, len(blob), offset + len(blobs)
              )
              blobs += blob
          Path("RegistrySentinel.ico").write_bytes(directory + blobs)
          print(f"Wrote RegistrySentinel.ico with {len(images)} sizes")

      - name: Build Registry Sentinel
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --version-file version_info.txt
          --icon RegistrySentinel.ico
          --name RegistrySentinel registry_sentinel.py

      - name: Check the build produced an executable carrying its version
        shell: pwsh
        run: |
          $exe = "dist\RegistrySentinel.exe"
          if (-not (Test-Path $exe) -or (Get-Item $exe).Length -eq 0) {
            throw "$exe is missing or empty"
          }
          $expected = "${{ needs.gate.outputs.version }}"
          $found = (Get-Item $exe).VersionInfo.FileVersion
          if ($found -ne $expected) {
            throw "The executable reports file version '$found' but the source carries '$expected'"
          }
          Write-Host "Built $exe reporting file version $found"

      - uses: actions/upload-artifact@v7
        with:
          name: RegistrySentinel
          path: dist/RegistrySentinel.exe
          if-no-files-found: error

      - name: Take the release notes from the commit body
        if: needs.gate.outputs.release == 'true'
        shell: bash
        run: git log -1 --pretty=%b > release-notes.md

      - name: Publish the release
        if: needs.gate.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.gate.outputs.version }}
          name: ${{ needs.gate.outputs.version }}
          body_path: release-notes.md
          files: dist/RegistrySentinel.exe
          fail_on_unmatched_files: true
          make_latest: 'true'
